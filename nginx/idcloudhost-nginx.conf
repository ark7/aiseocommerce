# ==============================================================================
# Nginx Reverse Proxy Dual Virtual Host Configuration for IDCloudHost VPS + Cloudflare
# Brand: LarisManis.online — Website komersial pemersatu jalur penjualan online Anda
# ==============================================================================

# 1. Upstream Next.js E-Commerce SaaS (Demo Store & Subdomain Multi-Tenant)
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 2. Upstream WordPress Marketing Landing Page
upstream wordpress_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Cloudflare Real IP Configuration
# Memastikan IP pengunjung asli tercatat akurat di log audit & keamanan
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ------------------------------------------------------------------------------
# VIRTUAL HOST 1: LANDING PAGE PEMASARAN (WordPress Self-Hosted)
# Domain: larismanis.online & www.larismanis.online
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/ssl/larismanis.crt;
    ssl_certificate_key /etc/nginx/ssl/larismanis.key;
    server_name larismanis.online www.larismanis.online;

    # Batas upload media WordPress (tema, plugin, banner video/foto)
    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Route utama WordPress Container (:8080)
    location / {
        proxy_pass http://wordpress_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeout settings
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}

# ------------------------------------------------------------------------------
# VIRTUAL HOST 2: DEMO STORE & MULTI-TENANT SAAS (Next.js Standalone)
# Subdomain: demo.larismanis.online, *.larismanis.online, atau domain kustom tenant
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/ssl/larismanis.crt;
    ssl_certificate_key /etc/nginx/ssl/larismanis.key;
    server_name demo.larismanis.online *.larismanis.online _;

    # Batas ukuran payload upload (bukti bayar, logo toko, foto produk)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache file statis Next.js secara optimal (1 tahun)
    location ^~ /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache public assets (favicon, images, dll.)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Route utama Next.js Standalone (:3000)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers asli dari client / Cloudflare
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
