# Netlify Configuration for Next.js 14 AI SEO E-Commerce SaaS
# Using standalone output mode

[build]
  command = "npm run build"
  publish = ".next/standalone"

[build.environment]
  NODE_VERSION = "18"
  NODE_OPTIONS = "--max_old_space_size=4096"

# For Next.js standalone mode - server runs directly
[[redirects]]
  from = "/*"
  to = "/"
  status = 200

# Environment variables (set these in Netlify UI Dashboard)
# DATABASE_URL = "postgresql://user:password@host:port/database?sslmode=require"
# JWT_SECRET = "your-strong-secret-key"
# NEXT_PUBLIC_APP_URL = "https://your-site.netlify.app"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
